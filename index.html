<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bro AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
flex-direction:column;
height:100vh;
color:white;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
margin:12px 0;
padding:12px;
border-radius:14px;
white-space:pre-wrap;
max-width:85%;
animation:show .2s;
}

.user{
background:#2563eb;
margin-left:auto;
}

.ai{
background:#1e293b;
}

#bottom{
display:flex;
padding:10px;
background:#111827;
}

input{
flex:1;
padding:14px;
font-size:17px;
border:none;
border-radius:12px;
outline:none;
}

button{
margin-left:10px;
padding:14px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

@keyframes show{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>
<body>

<div id="chat"></div>

<div id="bottom">
<input id="text" placeholder="Напиши сообщение">
<button onclick="send()">➜</button>
</div>

<script>

const chat=document.getElementById("chat")

const answers=[]

const randomReplies=[
"😄 Расскажи ещё",
"🔥 Интересно",
"❤️ Продолжай",
"🤔 Любопытно",
"😎 Пока не знаю что ответить но мне интересно",
"✨ Хорошая мысль"
]

function add(text,type){

let div=document.createElement("div")

div.className="msg "+type

div.innerHTML=text

chat.appendChild(div)

chat.scrollTop=chat.scrollHeight

}

function random(arr){
return arr[Math.floor(Math.random()*arr.length)]
}

function ai(text){

text=text.toLowerCase()

for(let item of answers){

for(let key of item.keys){

if(text.includes(key)){

return random(item.replies)

}

}

}

return random(randomReplies)

}

function send(){

let input=document.getElementById("text")

if(input.value=="") return

add("<b>Ты</b><br>"+input.value,"user")

let ans=ai(input.value)

setTimeout(()=>{

add("<b>Bro AI</b><br>"+ans,"ai")

},250)

input.value=""

}

document.getElementById("text").addEventListener("keydown",e=>{

if(e.key==="Enter") send()

})

add("<b>Bro AI</b><br>Привет броуууу 😎❤️","ai")
